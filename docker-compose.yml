name: tuya-exporter

services:
  tuya-exporter:
    build: .
    image: tuya-exporter:latest
    container_name: tuya-exporter
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./devices.json:/app/devices.json:ro
      - ./plant_config.yaml:/app/plant_config.yaml:ro
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Запуск wizard для обнаружения/обновления устройств:
  #   docker compose --profile wizard run --rm tuya-wizard
  tuya-wizard:
    build: .
    image: tuya-exporter:latest
    container_name: tuya-wizard
    profiles: ["wizard"]
    network_mode: host
    environment:
      - TZ=Europe/Moscow
    env_file:
      - .env
    volumes:
      - ./devices.json:/app/devices.json
      - ./tinytuya.json:/app/tinytuya.json
    stdin_open: true
    tty: true
    command: ["python", "wizard.py"]
