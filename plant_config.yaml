# Конфигурация пороговых значений влажности для растений
#
# Этот файл позволяет настроить оптимальные диапазоны влажности почвы
# для каждого растения. Изменения применяются автоматически без перезапуска.
#
# Скопируйте этот файл в plant_config.yaml и настройте под свои растения:
#   cp plant_config.yaml.example plant_config.yaml

# Значения по умолчанию для всех растений
# Используются если растение не указано в секции plants
defaults:
  humidity_min: 40  # Минимальная оптимальная влажность (%)
  humidity_max: 60  # Максимальная оптимальная влажность (%)
  group: unknown    # Группа освещения по умолчанию

# Настройки для конкретных растений
# Ключ - это имя растения из devices.json (поле "name")
plants:
  # Примеры для ваших текущих растений:

  Алла:
    humidity_min: 40
    humidity_max: 55
    group: alpha

  Филипп:
    humidity_min: 45
    humidity_max: 60
    group: alpha

  Кристофер:
    humidity_min: 9
    humidity_max: 20
    group: alpha

  Витек:
    humidity_min: 9
    humidity_max: 25
    group: alpha

  Лютик:
    humidity_min: 45
    humidity_max: 60
    group: bravo

  Цирилла:
    humidity_min: 60
    humidity_max: 100
    group: bravo

  Калантэ:
    humidity_min: 15
    humidity_max: 30
    group: alpha

  Зиновий:
    humidity_min: 0
    humidity_max: 25
    group: bravo

  Сайтама:
    humidity_min: 35
    humidity_max: 50
    group: bravo

  Паулина:
    humidity_min: 45
    humidity_max: 60
    group: alpha

  Анита:
    humidity_min: 10
    humidity_max: 30
    group: alpha

  Аглая:
    humidity_min: 35
    humidity_max: 50
    group: bravo

  Терентий II:
    humidity_min: 35
    humidity_max: 50
    group: alpha

  Геральт:
    humidity_min: 40
    humidity_max: 55
    group: alpha

  Хендрикс:
    humidity_min: 35
    humidity_max: 50
    group: bravo

# Настройки для розеток (управление освещением)
# Ключ - это имя розетки из devices.json (поле "name")
plugs:
  Альфа:
    group: alpha  # Группа освещения

  Браво:
    group: bravo  # Группа освещения

# Примечания:
# - Для новых растений из devices.json автоматически используются defaults
# - Старые записи в конфиге игнорируются если устройства нет в devices.json
# - Изменения в этом файле подхватываются при следующем цикле экспорта (~60 сек)
# - Поле 'group' позволяет группировать растения и розетки по зонам освещения для аналитики в Grafana
